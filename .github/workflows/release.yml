name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        type: string
      reuse_linux_run:
        description: Reuse exact-source Linux acceptance and packages from this run
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}

jobs:
  build:
    if: github.repository == 'henlamp/usd-mojo'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PXR_WORK_THREAD_LIMIT: "2"
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - if: matrix.os == 'ubuntu-24.04' && inputs.reuse_linux_run != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: usd-mojo-acceptance-Linux
          path: .build/release-acceptance
          run-id: ${{ inputs.reuse_linux_run }}
          github-token: ${{ github.token }}
      - if: matrix.os == 'ubuntu-24.04' && inputs.reuse_linux_run != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: usd-mojo-release-Linux
          path: .build/distributions
          run-id: ${{ inputs.reuse_linux_run }}
          github-token: ${{ github.token }}
      - name: Verify reused Linux package
        if: matrix.os == 'ubuntu-24.04' && inputs.reuse_linux_run != ''
        run: |
          python3 - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          root = Path('.build/distributions')
          report = json.loads((root / 'release.json').read_text())
          installed = json.loads((root / 'installed.json').read_text())
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert report['source_commit'] == installed['source_commit'] == head
          assert report['subdir'] == 'linux-64'
          assert installed['status'] == 'passed' and installed['fresh_environment']
          artifact = report['artifact']
          assert Path(artifact).name == artifact and artifact.endswith('.conda')
          package = root / 'linux-64' / artifact
          assert hashlib.sha256(package.read_bytes()).hexdigest() == report['sha256'] == installed['sha256']
          PY
      - if: ${{ !(matrix.os == 'ubuntu-24.04' && inputs.reuse_linux_run) }}
        uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514
        with:
          pixi-version: v0.81.0
          run-install: false
      - name: Fetch pinned corpus
        if: ${{ !(matrix.os == 'ubuntu-24.04' && inputs.reuse_linux_run) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pixi run --locked -e default python - <<'PY'
          import os, runpy, sys
          from urllib.parse import urlsplit
          from urllib.request import BaseHandler, build_opener, install_opener
          class GitHubAuth(BaseHandler):
              def https_request(self, request):
                  if urlsplit(request.full_url).hostname == 'api.github.com':
                      request.add_unredirected_header('Authorization', 'Bearer ' + os.environ['GH_TOKEN'])
                  return request
          install_opener(build_opener(GitHubAuth()))
          sys.argv = ['tools/corpus.py', '.local/corpus', '--fetch']
          runpy.run_path('tools/corpus.py', run_name='__main__')
          PY
      - if: ${{ !(matrix.os == 'ubuntu-24.04' && inputs.reuse_linux_run) }}
        run: pixi run --locked -e default acceptance --execution-kind native --corpus .local/corpus
        env:
          USD_MOJO_BUILD_DIR: .build/release-acceptance/default
      - if: ${{ !(matrix.os == 'ubuntu-24.04' && inputs.reuse_linux_run) }}
        run: pixi run --locked -e nightly acceptance --execution-kind native --corpus .local/corpus
        env:
          USD_MOJO_BUILD_DIR: .build/release-acceptance/nightly
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: usd-mojo-acceptance-${{ runner.os }}
          path: |
            .build/release-acceptance/**/*.json
            .build/release-acceptance/*/*.log
          include-hidden-files: true
          if-no-files-found: error
      - name: Build and test Conda package
        if: ${{ !(matrix.os == 'ubuntu-24.04' && inputs.reuse_linux_run) }}
        run: pixi exec --spec python=3.12.13 --spec rattler-build=0.76.1 -- python tools/release.py build --tag "$RELEASE_TAG"
      - name: Check fresh Pixi consumer
        if: ${{ !(matrix.os == 'ubuntu-24.04' && inputs.reuse_linux_run) }}
        run: pixi exec --spec python=3.12.13 -- python tools/release.py installed --tag "$RELEASE_TAG" --channel "file://$PWD/.build/distributions"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: usd-mojo-release-${{ runner.os }}
          path: |
            .build/distributions/*/*.conda
            .build/distributions/release.json
            .build/distributions/installed.json
          if-no-files-found: error
          include-hidden-files: true

  gate:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514
        with:
          pixi-version: v0.81.0
          run-install: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: usd-mojo-acceptance-*
          path: .build/release-evidence
      - run: pixi exec --spec python=3.12.13 -- python tools/release_gate.py --release-root .build/release-evidence

  publish:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514
        with:
          pixi-version: v0.81.0
          run-install: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: usd-mojo-release-${{ runner.os }}
          path: .build/distributions
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: usd-mojo-acceptance-*
          path: .build/release-evidence
      - name: Verify source and package
        run: pixi exec --spec python=3.12.13 --spec rattler-build=0.76.1 -- python tools/release.py verify --tag "$RELEASE_TAG" --acceptance-root .build/release-evidence
      - name: Publish to private channel using OIDC
        run: pixi exec --spec python=3.12.13 --spec rattler-build=0.76.1 -- python tools/release.py publish --tag "$RELEASE_TAG" --acceptance-root .build/release-evidence
      - name: Install published package by name
        run: pixi exec --spec python=3.12.13 -- python tools/release.py installed --tag "$RELEASE_TAG" --channel https://prefix.dev/henlamp/mojo
