name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag to verify or publish
        required: true
        type: string
      publish:
        description: Upload verified packages; requires dispatch from the matching version tag
        required: false
        default: false
        type: boolean
      reuse_run:
        description: Reuse exact-source acceptance and packages for both platforms from this run
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}

jobs:
  build:
    if: github.repository == 'henlamp/usd-mojo' && inputs.reuse_run == ''
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PXR_WORK_THREAD_LIMIT: "2"
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate release request
        env:
          REQUEST_PUBLISH: ${{ github.event_name == 'release' || inputs.publish }}
          REUSE_RUN: ${{ inputs.reuse_run }}
        run: |
          python3 tools/release_workflow.py request
          cp tools/release_workflow.py "$RUNNER_TEMP/usd-release-workflow.py"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514
        with:
          pixi-version: v0.81.0
          run-install: false
      - name: Fetch pinned corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pixi run --locked -e default python - <<'PY'
          import os, runpy, sys
          from urllib.parse import urlsplit
          from urllib.request import BaseHandler, build_opener, install_opener
          class GitHubAuth(BaseHandler):
              def https_request(self, request):
                  if urlsplit(request.full_url).hostname == 'api.github.com':
                      request.add_unredirected_header('Authorization', 'Bearer ' + os.environ['GH_TOKEN'])
                  return request
          install_opener(build_opener(GitHubAuth()))
          sys.argv = ['tools/corpus.py', '.local/corpus', '--fetch']
          runpy.run_path('tools/corpus.py', run_name='__main__')
          PY
      - run: pixi run --locked -e default acceptance --execution-kind native --corpus .local/corpus
        env:
          USD_MOJO_BUILD_DIR: .build/release-acceptance/default
      - run: pixi run --locked -e nightly acceptance --execution-kind native --corpus .local/corpus
        env:
          USD_MOJO_BUILD_DIR: .build/release-acceptance/nightly
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: usd-mojo-acceptance-${{ runner.os }}
          path: |
            .build/release-acceptance/**/*.json
            .build/release-acceptance/*/*.log
          include-hidden-files: true
          if-no-files-found: error
      - name: Build and test Conda package
        run: pixi exec --spec python=3.12.13 --spec rattler-build=0.76.1 -- python tools/release.py build --tag "$RELEASE_TAG"
      - name: Check fresh Pixi consumer
        run: pixi exec --spec python=3.12.13 -- python tools/release.py installed --tag "$RELEASE_TAG" --channel "file://$PWD/.build/distributions"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: usd-mojo-release-${{ runner.os }}
          path: |
            .build/distributions/*/*.conda
            .build/distributions/release.json
            .build/distributions/installed.json
          if-no-files-found: error
          include-hidden-files: true

  gate:
    needs: build
    if: >-
      ${{ !cancelled() && github.repository == 'henlamp/usd-mojo' &&
          (needs.build.result == 'success' ||
           (needs.build.result == 'skipped' && inputs.reuse_run != '')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate release request
        env:
          REQUEST_PUBLISH: ${{ github.event_name == 'release' || inputs.publish }}
          REUSE_RUN: ${{ inputs.reuse_run }}
        run: |
          python3 tests/release_workflow.py
          python3 tools/release_workflow.py request
          cp tools/release_workflow.py "$RUNNER_TEMP/usd-release-workflow.py"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514
        with:
          pixi-version: v0.81.0
          run-install: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: usd-mojo-*
          path: .build/release-input
          run-id: ${{ inputs.reuse_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Verify both package identities and installed consumers
        run: python3 "$RUNNER_TEMP/usd-release-workflow.py" packages --root .build/release-input
      - run: pixi exec --spec python=3.12.13 -- python tools/release_gate.py --release-root .build/release-input

  publish:
    needs: gate
    if: github.event_name == 'release' || inputs.publish
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514
        with:
          pixi-version: v0.81.0
          run-install: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: usd-mojo-release-${{ runner.os }}
          path: .build/distributions
          run-id: ${{ inputs.reuse_run || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: usd-mojo-acceptance-*
          path: .build/release-evidence
          run-id: ${{ inputs.reuse_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Verify source and package
        run: pixi exec --spec python=3.12.13 --spec rattler-build=0.76.1 -- python tools/release.py verify --tag "$RELEASE_TAG" --acceptance-root .build/release-evidence
      - name: Publish to private channel using OIDC
        run: pixi exec --spec python=3.12.13 --spec rattler-build=0.76.1 -- python tools/release.py publish --tag "$RELEASE_TAG" --acceptance-root .build/release-evidence
      - name: Install published package by name
        run: pixi exec --spec python=3.12.13 -- python tools/release.py installed --tag "$RELEASE_TAG" --channel https://prefix.dev/henlamp/mojo
