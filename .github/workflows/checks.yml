name: Library checks
on:
  push:
    branches: ["**"]
    paths-ignore: ["docs/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sdk-and-mojo:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
        environment: [default, nightly]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
        with:
          pixi-version: v0.81.0
          cache: true
      - run: pixi run --locked -e ${{ matrix.environment }} acceptance --execution-kind native
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: verification-${{ matrix.os }}-${{ matrix.environment }}
          path: |
            .build/acceptance.json
            .build/*.log
            .build/native-benchmarks/benchmark.json
            .build/api-verification.json
            .build/applications/acceptance.json
            .build/verification.json
            .build/package-verification.json
            .build/hardening.json
            .build/hardening/*.stderr.txt
            .build/benchmarks/benchmark.json
            .build/packages/*.tar.gz
            .build/packages/*.sha256
          include-hidden-files: true
          if-no-files-found: error
