name: Library checks
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      package_only:
        description: Check only the Linux package and a fresh installed consumer
        type: boolean
        default: false
      linux_candidate:
        description: Check both Linux compilers, external assets, package and fresh Pixi installation in one job
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  sdk-and-mojo:
    if: ${{ !inputs.package_only && !inputs.linux_candidate }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
        environment: [default, nightly]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
        with:
          pixi-version: v0.81.0
          cache: true
      - run: pixi run --locked -e ${{ matrix.environment }} acceptance --execution-kind native
      - if: matrix.environment == 'default'
        run: pixi exec --spec python=3.12.13 --spec rattler-build=0.76.1 -- python tools/release.py build
      - if: matrix.environment == 'default'
        run: pixi exec --spec python=3.12.13 -- python tools/release.py installed --channel "file://$PWD/.build/distributions"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: verification-${{ matrix.os }}-${{ matrix.environment }}
          path: |
            .build/acceptance.json
            .build/distributions/**
            .build/*.log
            .build/native-benchmarks/benchmark.json
            .build/api-verification.json
            .build/applications/acceptance.json
            .build/workloads/acceptance.json
            .build/release-gate-tests.json
            .build/scene-benchmarks/benchmark.json
            .build/mutation-array-benchmarks/benchmark.json
            .build/verification.json
            .build/package-verification.json
            .build/hardening.json
            .build/hardening/*.stderr.txt
            .build/benchmarks/benchmark.json
            .build/packages/*.tar.gz
            .build/packages/*.sha256
          include-hidden-files: true
          if-no-files-found: error
  linux-package:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.package_only || inputs.linux_candidate) }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.linux_candidate && 25 || 15 }}
    env:
      PXR_WORK_THREAD_LIMIT: "2"
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
      TOKIO_WORKER_THREADS: "2"
      RAYON_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514
        with:
          pixi-version: v0.81.0
          run-install: false
      - if: inputs.linux_candidate
        run: pixi run --locked -e default python tools/corpus.py .local/corpus --fetch
      - if: inputs.linux_candidate
        run: pixi run --locked -e default acceptance --execution-kind native --corpus .local/corpus
        env:
          USD_MOJO_BUILD_DIR: .build/linux-default
      - if: inputs.linux_candidate
        run: pixi run --locked -e nightly acceptance --execution-kind native --corpus .local/corpus
        env:
          USD_MOJO_BUILD_DIR: .build/linux-nightly
      - run: pixi exec --spec python=3.12.13 -- python tests/release_cache.py
      - run: pixi exec --spec python=3.12.13 --spec rattler-build=0.76.1 -- python tools/release.py build
      - run: pixi exec --spec python=3.12.13 -- python tools/release.py installed --channel "file://$PWD/.build/distributions"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: linux-package
          retention-days: 1
          path: |
            .build/distributions/**
            .build/linux-default/**/acceptance.json
            .build/linux-default/*.json
            .build/linux-default/*.log
            .build/linux-default/native-benchmarks/benchmark.json
            .build/linux-default/benchmarks/benchmark.json
            .build/linux-default/scene-benchmarks/benchmark.json
            .build/linux-default/mutation-array-benchmarks/benchmark.json
            .build/linux-nightly/**/acceptance.json
            .build/linux-nightly/*.json
            .build/linux-nightly/*.log
            .build/linux-nightly/native-benchmarks/benchmark.json
            .build/linux-nightly/benchmarks/benchmark.json
            .build/linux-nightly/scene-benchmarks/benchmark.json
            .build/linux-nightly/mutation-array-benchmarks/benchmark.json
          include-hidden-files: true
          if-no-files-found: error
